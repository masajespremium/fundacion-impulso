<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estado de solicitud | Fundación Impulso</title><style>body{font-family:system-ui;background:#101820;color:#f6f6f6;margin:0;padding:50px 16px}main{max-width:460px;margin:auto;background:#1b2934;padding:30px;border-radius:16px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0 18px;border-radius:8px;border:1px solid #637381;font:inherit}button{background:#d6a63b;color:#17202a;font-weight:bold;cursor:pointer}a{color:#eac56e}#resultado{line-height:1.6}</style></head><body><main><a href="index.html">← Fundación Impulso</a><h1>Consulta tu solicitud</h1><p>Introduce el código y la clave que recibiste al enviar tu solicitud.</p><form id="consulta"><label>Código de solicitud<input id="codigo" required maxlength="30"></label><label>Clave de consulta<input id="clave" required maxlength="100"></label><button>Consultar estado</button></form><div id="resultado" role="status"></div></main><script>const f=document.getElementById('consulta'),r=document.getElementById('resultado');document.getElementById('codigo').value=sessionStorage.getItem('impulso_consulta')||'';document.getElementById('clave').value=sessionStorage.getItem('impulso_clave')||'';f.addEventListener('submit',async e=>{e.preventDefault();r.textContent='Consultando…';try{const res=await fetch('/api/solicitudes/estado?codigo='+encodeURIComponent(document.getElementById('codigo').value)+'&clave='+encodeURIComponent(document.getElementById('clave').value));if(!res.ok)throw Error('No encontramos la solicitud con esos datos.');const data=await res.json();r.textContent='Estado: '+data.estado+(data.estado==='EN PROCESO'?'. Tiempo estimado de revisión: 12 a 24 horas.':'');}catch(err){r.textContent=err.message}})</script></body></html>
