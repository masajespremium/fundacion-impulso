<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Documentos | Fundación Impulso</title><style>body{margin:0;background:#101820;color:white;font:16px system-ui,sans-serif}header{background:#080c10;padding:22px 5%;border-bottom:2px solid #d9a43c}h1{margin:0;font-size:24px}main{max-width:1050px;margin:35px auto;padding:0 18px}button{background:#d9a43c;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}input{padding:12px;border-radius:8px;border:1px solid #aaa;width:180px}section{background:#1b2934;border-radius:12px;padding:20px;margin:20px 0}.item{border-top:1px solid #42515a;padding:12px 0}a{color:#f4c45c}iframe,img{max-width:100%;border:0;border-radius:8px}iframe{width:100%;height:520px;background:white}.preview{margin:12px 0}small{color:#cbd5df}#error{color:#ffb3b3}</style></head><body><header><h1>Fundación <span style="color:#e5ac3d">Impulso</span> · Documentos privados</h1></header><main><p>Acceso exclusivo para administradores. El navegador solicitará tus credenciales.</p><button id="cargar">Cargar solicitudes</button><p id="error" role="alert"></p><div id="solicitudes"></div></main><script>
const cont=document.getElementById('solicitudes'),error=document.getElementById('error');
const limpiar=el=>el.replaceChildren();
const txt=(tag,text)=>{const el=document.createElement(tag);el.textContent=String(text);return el;};
async function pedir(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('No se pudo acceder ('+r.status+'). Comprueba las credenciales y que el servidor esté funcionando.');return r.json();}
document.getElementById('cargar').onclick=async()=>{error.textContent='';limpiar(cont);try{const lista=await pedir('/api/admin/solicitudes');if(!lista.length){cont.append(txt('p','No hay solicitudes registradas.'));return;}for(const sol of lista){const sec=document.createElement('section');sec.append(txt('h2','Solicitud '+sol.codigo));sec.append(txt('small','Estado: '+sol.estado+' · ID: '+sol.id));const b=txt('button','Ver documentos');b.style.marginTop='14px';const docs=document.createElement('div');b.onclick=async()=>{limpiar(docs);try{const lista=await pedir('/api/admin/solicitudes/'+sol.id+'/documentos');if(!lista.length){docs.append(txt('p','Esta solicitud no tiene documentos.'));return;}for(const d of lista){const item=document.createElement('div');item.className='item';item.append(txt('p',d.campo+' — '+d.nombre));const a=txt('a','Abrir documento en otra pestaña');a.href='/api/admin/documentos/'+d.id;a.target='_blank';a.rel='noopener noreferrer';item.append(a);const vista=document.createElement('div');vista.className='preview';if(d.tipo.startsWith('image/')){const img=document.createElement('img');img.src=a.href;img.alt='Documento: '+d.campo;img.loading='lazy';vista.append(img);}else if(d.tipo==='application/pdf'){const pdf=document.createElement('iframe');pdf.src=a.href;pdf.title='Documento PDF: '+d.campo;vista.append(pdf);}item.append(vista);docs.append(item);}}catch(e){docs.append(txt('p',e.message));}};sec.append(b,docs);cont.append(sec);}}catch(e){error.textContent=e.message;}};
</script></body></html>
