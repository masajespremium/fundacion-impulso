<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administración | Fundación Impulso</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c131a;color:#edf3f8}header{background:#101b25;border-bottom:1px solid #dca83f;padding:22px max(20px,calc((100vw - 1200px)/2))}header h1{margin:0;font-size:24px}header span{color:#f0b441}main{max-width:1200px;margin:auto;padding:28px 20px}.muted{color:#a8b9c7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.panel{background:#182734;border:1px solid #31414f;border-radius:12px;padding:18px}.stat strong{font-size:30px;display:block;margin-top:7px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #566575;background:#101d28;color:#fff}input{flex:1;min-width:220px}button{cursor:pointer;background:#e8ad3e;color:#151515;border:0;font-weight:700}button.secondary{background:#304658;color:#fff}button:disabled{opacity:.6;cursor:not-allowed}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #354554}th{color:#b4c6d4;font-size:13px}td button{font-size:13px;padding:8px 12px}.pill{border-radius:30px;padding:5px 9px;background:#314354;white-space:nowrap}.detail{margin-top:18px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{background:#101d28;padding:12px;border-radius:8px;overflow-wrap:anywhere}.field small{display:block;color:#aabcca;margin-bottom:5px}.doc{padding:12px 0;border-bottom:1px solid #354554}.doc a{color:#f3c86e}.error{color:#ffaaaa}.ok{color:#a9e7c4}@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}}
</style></head><body><header><h1>Fundación <span>Impulso</span> · Panel administrativo</h1><div class="muted">Gestión privada de solicitudes</div></header><main><div class="stats"><div class="stat">Solicitudes<strong id="total">0</strong></div><div class="stat">En proceso<strong id="proceso">0</strong></div><div class="stat">Aprobadas<strong id="aprobadas">0</strong></div><div class="stat">Rechazadas<strong id="rechazadas">0</strong></div></div><div class="toolbar"><button id="recargar">Cargar solicitudes</button><input id="buscar" placeholder="Buscar por nombre o código" aria-label="Buscar solicitudes"><select id="filtro" aria-label="Filtrar estado"><option value="">Todos los estados</option><option>EN PROCESO</option><option>APROBADA</option><option>RECHAZADA</option></select></div><p id="mensaje" class="muted" role="status">Presiona Cargar solicitudes para consultar Oracle.</p><div class="panel tablewrap"><table><thead><tr><th>Nombre</th><th>Código</th><th>Fecha</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="filas"></tbody></table></div><section id="detalle" class="panel detail" hidden><h2 id="titulo"></h2><p class="muted" id="subtitulo"></p><h3>Datos de la solicitud</h3><div id="campos" class="fields"></div><h3>Documentos</h3><div id="documentos"></div><h3>Actualizar estado</h3><div class="toolbar"><select id="nuevoEstado"><option>EN PROCESO</option><option>APROBADA</option><option>RECHAZADA</option></select><button id="guardar">Guardar estado</button></div><p id="resultado" role="status"></p></section></main><script>
'use strict';let lista=[],actual=null;const $=id=>document.getElementById(id);const texto=(tag,val)=>{const e=document.createElement(tag);e.textContent=String(val??'—');return e};
async function api(url,opts={}){const r=await fetch(url,{cache:'no-store',...opts});if(!r.ok)throw Error('Error '+r.status+(r.status===401||r.status===403?' — revisa el usuario y contraseña de administrador':''));return r.json()}
const fecha=x=>x?new Date(x).toLocaleString('es-DO'):'—';
function dibujar(){const q=$('buscar').value.trim().toLowerCase(),f=$('filtro').value;const data=lista.filter(s=>(!f||s.estado===f)&&(!q||String(s.nombre||'').toLowerCase().includes(q)||s.codigo.toLowerCase().includes(q)));$('filas').replaceChildren();for(const s of data){const tr=document.createElement('tr');for(const v of [s.nombre||'Sin nombre',s.codigo,fecha(s.creado_en),s.estado]){const td=document.createElement('td');td.append(texto('span',v));tr.append(td)}const td=document.createElement('td'),b=texto('button','Revisar');b.onclick=()=>abrir(s);td.append(b);tr.append(td);$('filas').append(tr)}$('mensaje').textContent=lista.length?`Mostrando ${data.length} de ${lista.length} solicitudes.`:'No hay solicitudes registradas.'}
async function cargar(){try{$('mensaje').textContent='Consultando Supabase...';lista=await api('/api/admin/solicitudes');$('total').textContent=lista.length;$('proceso').textContent=lista.filter(s=>s.estado==='EN PROCESO').length;$('aprobadas').textContent=lista.filter(s=>s.estado==='APROBADA').length;$('rechazadas').textContent=lista.filter(s=>s.estado==='RECHAZADA').length;dibujar()}catch(e){$('mensaje').textContent=e.message;$('mensaje').className='error'}}
const etiquetas={nombre_completo:'Nombre completo',direccion:'Dirección',ciudad:'Ciudad',estado:'Provincia / estado',codigo_postal:'Código postal',ingreso_anual:'Ingreso anual',empresa:'Empresa',ocupacion:'Ocupación',industria:'Industria',frecuencia_pago:'Frecuencia de pago',tiene_conyuge:'Tiene cónyuge',conyuge_anio_inicio:'Año de inicio del cónyuge',conyuge_mes_inicio:'Mes de inicio del cónyuge',conyuge_ingreso_mensual:'Ingreso mensual del cónyuge',conyuge_ingreso_anual:'Ingreso anual del cónyuge',tiene_vehiculo:'Tiene vehículo'};
async function abrir(s){actual=s;$('detalle').hidden=false;$('titulo').textContent=s.nombre||'Solicitante';$('subtitulo').textContent=s.codigo+' · '+fecha(s.creado_en);$('nuevoEstado').value=s.estado;$('campos').replaceChildren();$('documentos').replaceChildren();$('resultado').textContent='';try{const [datos,docs]=await Promise.all([api('/api/admin/solicitudes/'+s.id+'/detalle'),api('/api/admin/solicitudes/'+s.id+'/documentos')]);for(const [k,v] of Object.entries(datos)){const box=document.createElement('div');box.className='field';box.append(texto('small',etiquetas[k]||k),texto('div',v));$('campos').append(box)}if(!docs.length)$('documentos').append(texto('p','Sin documentos'));for(const d of docs){const box=document.createElement('div');box.className='doc';box.append(texto('span',(etiquetas[d.campo]||d.campo)+' · '+d.nombre+' · '));const a=texto('a','Abrir documento');a.href='/api/admin/documentos/'+d.id;a.target='_blank';a.rel='noopener noreferrer';box.append(a);$('documentos').append(box)}$('detalle').scrollIntoView({behavior:'smooth'})}catch(e){$('resultado').textContent=e.message;$('resultado').className='error'}}
$('guardar').onclick=async()=>{if(!actual)return;const estado=$('nuevoEstado').value;if(!confirm('¿Cambiar el estado de '+actual.codigo+' a '+estado+'?'))return;try{const r=await api('/api/admin/solicitudes/'+actual.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado})});if(r.actualizadas!==1)throw Error('No se actualizó la solicitud');actual.estado=estado;$('resultado').textContent='Estado actualizado correctamente';$('resultado').className='ok';await cargar()}catch(e){$('resultado').textContent=e.message;$('resultado').className='error'}};
$('recargar').onclick=cargar;$('buscar').oninput=dibujar;$('filtro').onchange=dibujar;
</script></body></html>
